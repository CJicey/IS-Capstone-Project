<!doctype html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checkout.css') }}">
</head>

<body>
    <header class="header"> 
        <div class="left-header">
            <img class="company-logo" src="{{ url_for('static', filename='images/Beans.png') }}" alt="Company Logo">
        </div>
        <div class="middle-header">
            <nav class="header-nav">
                <a href="{{ url_for('index') }}">HOME</a>
                <a href="{{ url_for('checkout') }}">CHECKOUT</a>
                <a href="{{ url_for('sale') }}">SALE</a>
                <a href="{{ url_for('warehouse') }}">WAREHOUSE</a>
                <a href="{{ url_for('about_us') }}">ABOUT US</a>
            </nav>
        </div>
        <div class="right-header">
            <button class="cart-button" onclick="toggleCartPreview()">
                <img class="cart-icon" src="{{ url_for('static', filename='images/shoppingbag.jpg') }}" alt="Cart">
                <span id="cart-count" class="cart-count">0</span>
            </button>
            <div id="cart-preview" class="cart-preview">
                <h4>Your Cart</h4>
                <ul id="cart-items"></ul>
                <p id="cart-total" style="font-weight: bold;"></p>
            </div>
        </div>
    </header>

    <section class="hero">
        <h1>Checkout</h1>
        <p>Complete your purchase by filling out the form below.</p>
    </section>

    <main class="main-content">
        <form id="checkout-form">
            <div class="form-group">
                <input type="text" placeholder="First Name" id="fname" name="fname" required>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Last Name" id="lname" name="lname" required>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Address" id="address" name="address" required>
            </div>
            <div class="form-group">
                <input type="text" placeholder="City" id="city" name="city" required>
            </div>
            <div class="form-group">
                <input type="text" placeholder="State" id="state" name="state" required>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Zipcode" id="zipcode" name="zipcode" required>
            </div>
            <div class="form-group">
                <input type="text" id="country" name="country" value="United States" readonly>
            </div>
            <br><br>
            <div class="form-group">
                <input type="text" placeholder="Credit Card Number" id="creditcard" name="creditcard" required>
                <p id="card-type"></p>
            </div>
            <div class="form-group">
                <input type="text" placeholder="Expiration Date (MM/YY)" id="expdate" name="expdate" required>
            </div>
            <div class="form-group">
                <input type="text" placeholder="CVV" id="CVV" name="CVV" required>
            </div>
            <button type="submit" class="button">Checkout Now</button>
        </form>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Your Company Name. All Rights Reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/checkout.js') }}"></script>

</body>
</html>
