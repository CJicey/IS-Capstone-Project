<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/general.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/eccomerce.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F4ECE1;
            color: #3E2F1B;
            margin: 0;
        }
        .header {
            background-color: #534545;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }
        .company-logo {
            width: 150px;
        }
        .header-nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .cart-button {
            background: none;
            border: none;
            cursor: pointer;
            position: relative;
        }
        .cart-icon {
            height: 50px;
            width: 50px;
        }
        .cart-count {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #A68A64;
            color: white;
            border-radius: 50%;
            padding: 4px 8px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .products {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }
        .product {
            background: #E6E4D9;
            padding: 20px;
            margin: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .product img {
            width: 300px;
            height: 300px;
            object-fit: cover;
        }
        .button {
            background-color: #A68A64;
            color: white;
            padding: 10px 20px;
            margin-top: 10px;
            border: none;
            cursor: pointer;
        }
        .footer {
            background-color: #534545;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header class="header">
        <img class="company-logo" src="{{ url_for('static', filename='images/Beans.png') }}" alt="Company Logo">
        <nav class="header-nav">
            <a href="{{ url_for('index') }}">HOME</a>
            <a href="{{ url_for('checkout') }}">CHECKOUT</a>
            <a href="{{ url_for('sale') }}">SALE</a>
            <a href="{{ url_for('warehouse') }}">WAREHOUSE</a>
            <a href="{{ url_for('about_us') }}">ABOUT US</a>
        </nav>
        <button class="cart-button" onclick="window.location.href='{{ url_for('checkout') }}'">
            <img class="cart-icon" src="{{ url_for('static', filename='images/shoppingbag.jpg') }}" alt="Cart">
            <span id="cart-count" class="cart-count">0</span>
        </button>
    </header>

    <main>
        <section class="products">
            <div class="product">
                <img src="{{ url_for('static', filename='images/lightroastfront.png') }}" alt="Light Roast">
                <h2>Lighter Fare</h2>
                <p class="price">$16.00</p>
                <button class="button" onclick="addToCart('Lighter Fare', 16.00)">Add to Cart</button>
            </div>
            <div class="product">
                <img src="{{ url_for('static', filename='images/mediumroastfront.png') }}" alt="Medium Roast">
                <h2>Darker</h2>
                <p class="price">$16.00</p>
                <button class="button" onclick="addToCart('Darker', 16.00)">Add to Cart</button>
            </div>
            <div class="product">
                <img src="{{ url_for('static', filename='images/darkroastfront.png') }}" alt="Dark Roast">
                <h2>Dark & Potent</h2>
                <p class="price">$16.00</p>
                <button class="button" onclick="addToCart('Dark & Potent', 16.00)">Add to Cart</button>
            </div>
        </section>

        <section class="products">
            <div class="product">
                <img src="{{ url_for('static', filename='images/logomug.png') }}" alt="B&T Mug">
                <h2>B&T Mug</h2>
                <p class="price"><del>$15.00</del> $10.00</p>
                <button class="button" onclick="addToCart('B&T Mug', 10.00)">Add to Cart</button>
            </div>
            <div class="product">
                <img src="{{ url_for('static', filename='images/darkroastback.png') }}" alt="Product 2">
                <h2>Product 2</h2>
                <p class="price"><del>$80.00</del> $50.00</p>
                <button class="button" onclick="addToCart('Product 2', 50.00)">Add to Cart</button>
            </div>
            <div class="product">
                <img src="{{ url_for('static', filename='images/product1.png') }}" alt="Product 3">
                <h2>Product 3</h2>
                <p class="price"><del>$120.00</del> $90.00</p>
                <button class="button" onclick="addToCart('Product 3', 90.00)">Add to Cart</button>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Company Name. All rights reserved.</p>
    </footer>
    <script src="{{ url_for('static', filename='js/sale.js') }}"></script>
</body>
</html>
