<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/general.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/eccomerce.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F4ECE1; /* Creamy beige */
            color: #3E2F1B; /* Rich brown */
        }
        .header {
            background-color: #534545; /* Earthy green */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }
        .company-logo {
            width: 150px; /* Small logo size */
            height: auto;
        }
        .header-nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .hero {
            text-align: center;
            background: url('{{ url_for("static", filename="images/hero-image.jpg") }}') no-repeat center center/cover;
            color: rgb(186, 160, 160);
            padding: 80px 20px;
        }
        .hero h1 {
            font-size: 3em;
        }
        .button {
            background-color: #A68A64; /* Muted golden yellow */
            color: white;
            padding: 15px 30px;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            margin-top: 20px;
        }
        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 20px;
        }
        .product {
            background: #E6E4D9; /* Soft greenish beige */
            padding: 20px;
            margin: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .product img {
            width: 300px; /* Set uniform width */
            height: 300px; /* Set uniform height */
            object-fit: cover; /* Ensure images are well-fitted */
            border-radius: 5px;
        }
        .footer {
            background-color: #534545; /* Earthy green */
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="left-header">
            <img class="company-logo" src="{{ url_for('static', filename='images/Beans.png') }}" alt="Company Logo">
        </div>
        <div class="middle-header">
            <nav class="header-nav">
                <a class="home-header" href="{{ url_for('index') }}">HOME</a>
                <a class="checkout-header" href="{{ url_for('checkout') }}">CHECKOUT</a>
                <a class="sale-header" href="{{ url_for('sale') }}">SALE</a>
                <a class="aboutus-header" href="{{ url_for('about_us') }}">ABOUT US</a>
            </nav>
        </div>
    </header>
    
    <main>
        <section class="sale-items">
            <div class="product">
                <img src="{{ url_for('static', filename='images/mug.png') }}" alt="Product 1">
                <h2>B&T Mug</h2>
                <p class="price"><del>$15.00</del> $10.00</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="{{ url_for('static', filename='images/darkroastback.png') }}" alt="Product 2">
                <h2>Product 2</h2>
                <p class="price"><del>$80.00</del> $50.00</p>
                <button>Add to Cart</button>
            </div>
            <div class="product">
                <img src="{{ url_for('static', filename='images/product3.jpg') }}" alt="Product 3">
                <h2>Product 3</h2>
                <p class="price"><del>$120.00</del> $90.00</p>
                <button>Add to Cart</button>
            </div>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 Company Name. All rights reserved.</p>
    </footer>
</body>
</html>
