<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beans & Things - Home</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/eccomerce.css') }}">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F4ECE1; /* Creamy beige */
            color: #3E2F1B; /* Rich brown */
        }
        .header {
            background-color: #534545; /* Earthy brown */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }
        .company-logo {
            width: 150px; /* Small logo size */
            height: auto;
        }
        .header-nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .hero {
            text-align: center;
            background: url('{{ url_for("static", filename="images/hero-image.jpg") }}') no-repeat center center/cover;
            color: rgb(186, 160, 160);
            padding: 80px 20px;
        }
        .hero h1 {
            font-size: 3em;
        }
        .button {
            background-color: #A68A64; /* Muted golden yellow */
            color: white;
            padding: 15px 30px;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            margin-top: 20px;
        }
        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 20px;
        }
        .product {
            background: #E6E4D9; /* Soft greenish beige */
            padding: 20px;
            margin: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .product img {
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 5px;
        }
        .footer {
            background-color: #534545;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="left-header">
            <img class="company-logo" src="{{ url_for('static', filename='images/Beans.png') }}" alt="Company Logo">
        </div>
        <nav class="header-nav">
            <a href="{{ url_for('index') }}">HOME</a>
            <a href="{{ url_for('checkout') }}">CHECKOUT</a>
            <a href="{{ url_for('sale') }}">SALE</a>
            <a href="{{ url_for('warehouse') }}">Warehouse</a>
            <a href="{{ url_for('about_us') }}">ABOUT US</a>
        </nav>
    </header>
    <section class="hero">
        <h1>Welcome to Beans & Things</h1>
        <p>Bold, smooth, and irresistibly flavorful.</p>
        <button class="button" onclick="window.location.href='{{ url_for('sale') }}'">Shop now</button>
    </section>
    <section class="products">
        <div class="product">
            <img src="{{ url_for('static', filename='images/lightroastfront.png') }}" alt="Light Roast">
            <h2>Lighter Fare</h2>
            <p class="price">$16.00</p>
            <button class="button" onclick="addToCart('Lighter Fare')">Add to Cart</button>
        </div>
        <div class="product">
            <img src="{{ url_for('static', filename='images/mediumroastfront.png') }}" alt="Medium Roast">
            <h2>Darker</h2>
            <p class="price">$16.00</p>
            <button class="button" onclick="addToCart('Darker')">Add to Cart</button>
        </div>
        <div class="product">
            <img src="{{ url_for('static', filename='images/darkroastfront.png') }}" alt="Dark Roast">
            <h2>Dark & Potent</h2>
            <p class="price">$16.00</p>
            <button class="button" onclick="addToCart('Dark & Potent')">Add to Cart</button>
        </div>
    </section>
    <footer class="footer">
        <p>&copy; 2025 Beans & Things. All rights reserved.</p>
    </footer>

    <script>
        function addToCart(item) {
            alert(item + " added to cart!");
        }
    </script>
</body>
</html>
