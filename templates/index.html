<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce UI</title>
    <link rel="stylesheet" href="static/css/eccomerce.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #F4ECE1; /* Creamy beige */
            color: #3E2F1B; /* Rich brown */
        }
        .header {
            background-color: #534545; /* Earthy green */
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
        }
        .company-logo {
            width: 150px; /* Small logo size */
            height: auto;
        }
        .header-nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
        }
        .hero {
            text-align: center;
            background: url('hero-image.jpg') no-repeat center center/cover;
            color: rgb(186, 160, 160);
            padding: 80px 20px;
        }
        .hero h1 {
            font-size: 3em;
        }
        .button {
            background-color: #A68A64; /* Muted golden yellow */
            color: white;
            padding: 15px 30px;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            margin-top: 20px;
        }
        .products {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            padding: 20px;
        }
        .product {
            background: #E6E4D9; /* Soft greenish beige */
            padding: 20px;
            margin: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .product img {
            width: 300px; /* Set uniform width */
            height: 300px; /* Set uniform height */
            object-fit: cover; /* Ensure images are well-fitted */
            border-radius: 5px;
        }
        .footer {
            background-color: #534545; /* Earthy green */
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="left-header">
            <img class="company-logo" src="static/images/Beans.png" alt="Company Logo">
        </div>
        <nav class="header-nav">
            <a href="templates/index.html">HOME</a>
            <a href="templates/shop.html">SHOP</a>
            <a href="templates/checkout.html">CHECKOUT</a>
            <a href="templates/sale.html">SALE</a>
            <a href="templates/about.html">ABOUT US</a>
        </nav>
    </header>
    <section class="hero">
        <h1>Welcome to Beans & Things</h1>
        <p>Bold, smooth, and irresistibly flavorful.</p>
        <button class="button">Shop Now</button>
    </section>
    <section class="products">
        <div class="product">
            <img src="static/images/lightroastfront.png" alt="Product 1">
            <h2>Lighter Fare</h2>
            <p class="price">$16.00</p>
            <button class="button">Add to Cart</button>
        </div>
        <div class="product">
            <img src="static/images/mediumroastfront.png" alt="Product 2">
            <h2>Darker</h2>
            <p class="price">$16.00</p>
            <button class="button">Add to Cart</button>
        </div>
        <div class="product">
            <img src="static/images/darkroastfront.png" alt="Product 3">
            <h2>Dark & Potent</h2>
            <p class="price">$16.00</p>
            <button class="button">Add to Cart</button>
        </div>
    </section>
    <footer class="footer">
        <p>&copy; 2025 E-Commerce. All rights reserved.</p>
    </footer>
</body>
</html>
