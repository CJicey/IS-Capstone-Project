<!doctype html>
<html lang="en-us">
<head>
    <meta charset="utf-8">
    <title>Homepage</title>
    <link rel="stylesheet" href="/css/index.css">
    <link rel="stylesheet" href="/css/indexheader.css">
</head>
<body>
    <header class="header"> 
        <!-- Left Header -->
        <div class="left-header">
            <img class="company-logo" src="{{ url_for('static', filename='images/companyname.png') }}">
        </div>
        
        <!-- Middle Header -->
        <div class="middle-header">
            <nav class="header-nav">
                <a class="home-header" href="{{ url_for('home') }}">HOME</a>
                <a class="shop-header" href="{{ url_for('shop') }}">SHOP</a>
                <a class="prebrew-header" href="{{ url_for('prebrewed') }}">PRE-BREWED</a>
                <a class="sale-header" href="{{ url_for('sale') }}">SALE</a>
                <a class="aboutus-header" href="{{ url_for('about_us') }}">ABOUT US</a>
            </nav>
        </div>
        
        <!-- Right Header -->
        <div class="right-header">
            <div class="cart-container">
                <button class="cart-button">
                    <img class="cart-icon" src="{{ url_for('static', filename='images/shoppingbag.jpg') }}" alt="">
                    <div class="tooltip">Bag</div>
                    <div class="cart-count">{{ cart_count }}</div>
                </button>
            </div>
        </div>
    </header>
    
    <main>
        <div class="index-grid">
            <div class="index-content">
                <img src="{{ url_for('static', filename='images/homepagepic.png') }}" alt="">
            </div>
        </div>
    </main>
</body>
</html>
